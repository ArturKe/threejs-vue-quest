<div class="vrui-draw-element" data-vrui-root>
  <h2 class="vrui-title">VR PANEL UI</h2>
  <p class="vrui-fps" data-vrui-fps>0 FPS</p>
  <button type="button" class="vrui-button vrui-button-toggle" data-vrui-btn="toggle">
    PAUSE ANIMATION
  </button>
  <button type="button" class="vrui-button vrui-button-reset" data-vrui-btn="reset">
    RESET OBJECTS
  </button>
  <button type="button" class="vrui-checkbox-row" data-vrui-btn="flip">
    <span class="vrui-checkbox-label">Flip Stereo Eyes</span>
    <span class="vrui-checkbox" data-vrui-flip-box></span>
  </button>
</div>
